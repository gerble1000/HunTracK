name: iOS App Store screenshots

# Simulator screenshots only. This workflow does not sign a distribution
# build and does not upload anything to App Store Connect.
#
# The screenshot job runs only for workflow_dispatch. GitHub will not accept
# that event until this file has run at least once, and the file stays off
# main. Opening the pull request runs the tiny register job so the macOS
# job can then be dispatched.
on:
  workflow_dispatch:
  pull_request:
    types: [opened]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ios-appstore-screenshots-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  register:
    if: github.event_name == 'pull_request'
    name: Register workflow
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Register for workflow_dispatch
        run: echo "ios-screenshots.yml can now be started with workflow_dispatch."

  screenshots:
    if: github.event_name == 'workflow_dispatch'
    name: Capture App Store screenshots
    runs-on: macos-15
    timeout-minutes: 22
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Capture screenshots
        run: bash .github/scripts/ios-screenshots.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: huntrack-appstore-screenshots
          path: screenshots
          if-no-files-found: ignore
