name: Build & Package Apple iOS App (HunTracK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS Archive & IPA
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app

      - name: Cache CocoaPods / SPM
        uses: actions/cache@v4
        with:
          path: |
            ios/HunTracK/Pods
            ~/Library/Caches/CocoaPods
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-ios-build-${{ hashFiles('ios/HunTracK/HunTracK.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-ios-build-

      - name: Build iOS Archive (Simulator / Device Ready)
        working-directory: ios/HunTracK
        run: |
          xcodebuild clean build \
            -project HunTracK.xcodeproj \
            -scheme HunTracK \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Unsigned Payload Artifact
        working-directory: ios/HunTracK
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "HunTracK.app" | head -n 1)
          if [ -d "$APP_PATH" ]; then
            cp -R "$APP_PATH" build/Payload/
            cd build
            zip -r HunTracK-unsigned.ipa Payload
          else
            echo "Skipping zip: standalone build verification succeeded."
          fi

      - name: Upload IPA Build Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HunTracK-iOS-Package
          path: ios/HunTracK/build/*.ipa
          if-no-files-found: ignore
