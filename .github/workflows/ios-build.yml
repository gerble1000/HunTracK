name: Build, Sign & Deploy Apple iOS App (HunTracK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to TestFlight
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Setup App Store Connect Private Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}.p8

      - name: Build iOS App Archive
        working-directory: ios/HunTracK
        run: |
          xcodebuild clean archive \
            -project HunTracK.xcodeproj \
            -scheme HunTracK \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/HunTracK.xcarchive \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Payload IPA Artifact
        working-directory: ios/HunTracK
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/HunTracK.xcarchive -name "HunTracK.app" | head -n 1)
          if [ -d "$APP_PATH" ]; then
            cp -R "$APP_PATH" build/Payload/
            cd build
            zip -r HunTracK-Release.ipa Payload
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HunTracK-iOS-Package
          path: ios/HunTracK/build/*.ipa
          if-no-files-found: ignore
