name: Build, Sign & Deploy Apple iOS App (HunTracK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-sign-deploy:
    name: Build, Sign & Upload to TestFlight
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install Apple Distribution Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          CERTIFICATE_RAW=$RUNNER_TEMP/raw_cert.p12
          CERTIFICATE_LEGACY=$RUNNER_TEMP/legacy_cert.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)

          # Decode certificate and provisioning profile from secrets (macOS base64 -D)
          echo "$BUILD_CERTIFICATE_BASE64" | base64 -D > $CERTIFICATE_RAW
          echo "$PROVISIONING_PROFILE_BASE64" | base64 -D > $PP_PATH

          # Re-export PKCS#12 using legacy 3DES/SHA1 encryption compatible with macOS Security framework
          openssl pkcs12 -in $CERTIFICATE_RAW -passin pass:"$P12_PASSWORD" \
            -export -out $CERTIFICATE_LEGACY -passout pass:"$P12_PASSWORD" \
            -legacy -nomaciter -descert \
            -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES

          # Create and configure temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate to temporary keychain
          security import $CERTIFICATE_LEGACY -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')

          # Install provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/42a832cd-962d-42bd-9c42-b4763768ee43.mobileprovision

      - name: Setup App Store Connect API Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}" | base64 -D > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}.p8

      - name: Build and Archive iOS App
        working-directory: ios/HunTracK
        run: |
          xcodebuild clean archive \
            -project HunTracK.xcodeproj \
            -scheme HunTracK \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/HunTracK.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=3BWVS7PL6M \
            PROVISIONING_PROFILE=42a832cd-962d-42bd-9c42-b4763768ee43 \
            PROVISIONING_PROFILE_SPECIFIER="HunTracK AppStore Distribution"

      - name: Export Signed IPA for App Store
        working-directory: ios/HunTracK
        run: |
          xcodebuild -exportArchive \
            -archivePath build/HunTracK.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/exported \
            -allowProvisioningUpdates

      - name: Validate App with App Store Connect
        run: |
          IPA_PATH=$(find ios/HunTracK/build/exported -name "*.ipa" | head -n 1)
          echo "Found IPA at: $IPA_PATH"
          xcrun altool --validate-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}" \
            --apiIssuer "${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}"

      - name: Upload App to TestFlight
        run: |
          IPA_PATH=$(find ios/HunTracK/build/exported -name "*.ipa" | head -n 1)
          echo "Uploading $IPA_PATH to TestFlight..."
          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}" \
            --apiIssuer "${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}"

      - name: Upload IPA Build Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HunTracK-iOS-Package
          path: ios/HunTracK/build/exported/*.ipa
          if-no-files-found: ignore

      - name: Clean up Keychain & Secrets
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
          rm -f ~/.appstoreconnect/private_keys/AuthKey_*.p8
          rm -rf ~/Library/MobileDevice/Provisioning\ Profiles/*
