name: Build, Sign & Deploy Apple iOS App (HunTracK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-sign-deploy:
    name: Build, Sign & Upload to TestFlight
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          # Discover latest available Xcode 26.x or Xcode 16.x
          XCODE_APP=$(ls -d /Applications/Xcode_26*.app /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$XCODE_APP" ]; then
            echo "Selected Xcode: $XCODE_APP"
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          fi
          xcodebuild -version

      - name: Install Apple Distribution Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          CERTIFICATE_RAW=$RUNNER_TEMP/raw_cert.p12
          CERTIFICATE_PEM=$RUNNER_TEMP/cert_and_key.pem
          CERTIFICATE_LEGACY=$RUNNER_TEMP/legacy_cert.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)

          # Locate Homebrew OpenSSL 3 on macOS ARM64 runner
          OPENSSL_BIN="/opt/homebrew/opt/openssl@3/bin/openssl"
          if [ ! -x "$OPENSSL_BIN" ]; then
            OPENSSL_BIN=$(which openssl)
          fi
          echo "Using OpenSSL from: $OPENSSL_BIN ($($OPENSSL_BIN version))"

          # Decode certificate and provisioning profile from secrets (macOS base64 -D)
          echo "$BUILD_CERTIFICATE_BASE64" | base64 -D > $CERTIFICATE_RAW
          echo "$PROVISIONING_PROFILE_BASE64" | base64 -D > $PP_PATH

          # Convert to PEM and re-export PKCS#12 with legacy 3DES/SHA1 cipher parameters
          "$OPENSSL_BIN" pkcs12 -in $CERTIFICATE_RAW -passin pass:"$P12_PASSWORD" -nodes -out $CERTIFICATE_PEM
          "$OPENSSL_BIN" pkcs12 -export -in $CERTIFICATE_PEM -out $CERTIFICATE_LEGACY -passout pass:"$P12_PASSWORD" \
            -legacy -nomaciter -descert \
            -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES

          # Create and configure temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate to temporary keychain
          security import $CERTIFICATE_LEGACY -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')

          # Install provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/42a832cd-962d-42bd-9c42-b4763768ee43.mobileprovision

      - name: Setup App Store Connect API Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}" | base64 -D > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}.p8

      - name: Build and Archive iOS App
        working-directory: ios/HunTracK
        run: |
          xcodebuild clean archive \
            -project HunTracK.xcodeproj \
            -scheme HunTracK \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/HunTracK.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=3BWVS7PL6M \
            PROVISIONING_PROFILE=42a832cd-962d-42bd-9c42-b4763768ee43 \
            PROVISIONING_PROFILE_SPECIFIER="HunTracK AppStore Distribution"

      - name: Export Signed IPA for App Store
        working-directory: ios/HunTracK
        run: |
          xcodebuild -exportArchive \
            -archivePath build/HunTracK.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/exported \
            -allowProvisioningUpdates

      - name: Validate App with App Store Connect
        run: |
          IPA_PATH=$(find ios/HunTracK/build/exported -name "*.ipa" | head -n 1)
          echo "Found IPA at: $IPA_PATH"
          xcrun altool --validate-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}" \
            --apiIssuer "${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}"

      - name: Upload App to TestFlight
        run: |
          IPA_PATH=$(find ios/HunTracK/build/exported -name "*.ipa" | head -n 1)
          echo "Uploading $IPA_PATH to TestFlight..."
          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}" \
            --apiIssuer "${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}"

      # altool only delivers the binary to App Store Connect. Without this step
      # the build sits unassigned and testers never see it.
      - name: Distribute Build to TestFlight Testers
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          BUNDLE_ID: uk.hunttrack.app
        run: |
          set -euo pipefail
          APP_DIR=$(find ios/HunTracK/build/HunTracK.xcarchive/Products/Applications \
            -maxdepth 1 -name "*.app" -type d | head -n 1)
          if [ -z "$APP_DIR" ]; then
            echo "No .app bundle found in ios/HunTracK/build/HunTracK.xcarchive" >&2
            exit 1
          fi
          export BUILD_NUMBER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_DIR/Info.plist")
          export ASC_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          if [ ! -f "$ASC_KEY_PATH" ]; then
            echo "App Store Connect key not found at $ASC_KEY_PATH" >&2
            exit 1
          fi
          echo "Distributing build ${BUILD_NUMBER} of ${BUNDLE_ID} to all beta groups"
          node .github/scripts/testflight-distribute.mjs

      - name: Upload IPA Build Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HunTracK-iOS-Package
          path: ios/HunTracK/build/exported/*.ipa
          if-no-files-found: ignore

      - name: Clean up Keychain & Secrets
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
          rm -f ~/.appstoreconnect/private_keys/AuthKey_*.p8
          rm -rf ~/Library/MobileDevice/Provisioning\ Profiles/*
